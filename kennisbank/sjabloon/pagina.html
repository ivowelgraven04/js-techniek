<script>
  (function() {
    document.querySelectorAll('.faq-question').forEach(function(knop) {
      knop.addEventListener('click', function() {
        var open = knop.getAttribute('aria-expanded') === 'true';
        knop.setAttribute('aria-expanded', open ? 'false' : 'true');
        knop.closest('.faq-item').classList.toggle('open', !open);
      });
    });
  })();
</script>
